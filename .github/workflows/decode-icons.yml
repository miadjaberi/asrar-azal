name: Decode Icons
on:
  push:
    paths:
      - 'icons-b64/**'
      - '.github/workflows/decode-icons.yml'
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNG icons
        run: |
          mkdir -p out
          base64 -d icons-b64/icon-192.png.b64 > icon-192.png
          base64 -d icons-b64/icon-512.png.b64 > icon-512.png
          base64 -d icons-b64/icon-maskable-512.png.b64 > icon-maskable-512.png
          file icon-192.png icon-512.png icon-maskable-512.png
          ls -la icon-*.png
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png icon-maskable-512.png
          git diff --cached --quiet || git commit -m "assets: add PWA icons from user M logo"
          git push
