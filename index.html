  const b=C.books[a];if(!b)return show('lib');
  pg.innerHTML=`<div class="ph"><button class="back" data-go="lib">←</button><h3>جزئیات</h3></div>
  <div class="box"><h3>${esc(b.t)}</h3><p>${esc(b.a)} · ${esc(b.cat)}</p><p style="color:var(--gold);font-weight:700;margin:8px 0">${esc(b.price||'')}</p><p>${esc(b.desc)}</p><button class="btn" style="margin-top:12px;width:100%" data-go="cafe">درخواست خرید / ارتباط</button></div>`;
 } else if(p==='istk'){
  setNav(3);
  pg.innerHTML=`<div class="ph"><button class="back" data-go="home">←</button><h3>مودال‌ها / ابزارها</h3></div>`+C.modals.map(m=>`<div class="box"><h3>${esc(m.t)}</h3><p>${esc(m.s)}</p></div>`).join('');
 } else if(p==='cafe'){
  pg.innerHTML=`<div class="ph"><button class="back" data-go="home">←</button><h3>اشتراک‌ها و ارتباط</h3></div>`+C.plans.map(pl=>`<div class="box"><b>${esc(pl.t)}</b><span class="pr">${esc(pl.price)}</span></div>`).join('')+`<div class="box"><h3>تماس</h3><p>${esc(C.acts.phone)}</p><p>@${esc(C.brand.tg)}</p></div>`;
 } else if(p==='comm'){
  pg.innerHTML=`<div class="ph"><button class="back" data-go="home">←</button><h3>دعاها</h3></div><div class="box"><p>به‌تدریج اضافه می‌شود.</p></div>`;
 } else if(p==='prof'){
  setNav(4);
  pg.innerHTML=`<div class="ph"><button class="back" data-go="home">←</button><h3>پروفایل</h3></div><div class="box"><p>@${esc(C.brand.tg)}</p><p>${esc(C.acts.phone)}</p></div>`;
 }
}
function render(){
 const tr=$('#tr');if(tr){tr.innerHTML='';C.banners.forEach((b,i)=>{const d=document.createElement('div');d.className='slide s'+(i%4);d.innerHTML=`<div class="bt"><h2>${esc(b.t)}</h2><p>${esc(b.p)}</p><button data-go="${esc(b.go||'')}">${esc(b.b)}</button></div>`;tr.appendChild(d);});}
 const dots=$('#dots');if(dots)dots.innerHTML=C.banners.map((_,i)=>`<i class="${i===bi?'on':''}"></i>`).join('');
 go(bi);
 const qk=$('#qk');if(qk)qk.innerHTML=C.quick.map((q,i)=>`<button class="q" data-go="${esc(q.pg)}"><div class="ic"><svg class="i"><use href="#${['book','cup','star','users'][i%4]}"/></svg></div><b>${esc(q.t)}</b><small>${esc(q.s)}</small></button>`).join('');
 const st=$('#st'),al=$('#al');if(st)st.textContent=C.secT;if(al)al.textContent=C.all;
 const cv=$('#cv');if(cv){cv.querySelectorAll('.bk').forEach(e=>e.remove());C.books.forEach((b,k)=>{const e=document.createElement('div');e.className='bk';e.style.background='#1a1630';e.innerHTML=`<h4>${esc(b.t)}</h4><small>${esc(b.price||b.a)}</small>`;e.onclick=()=>cc(k);cv.appendChild(e);});cc(ci);}
 tt(ti);
 if(C.welcome&&C.welcome.on==='1'&&!sessionStorage.getItem('asrar_welcomed')){
  const wm=$('#mo');
  if(wm){wm.innerHTML=`<div style="background:#13102a;border:1.5px solid var(--gold2);border-radius:20px;padding:22px;max-width:340px;width:90%;direction:rtl;text-align:center"><h3 style="color:var(--gold);margin-bottom:10px">${esc(C.welcome.t)}</h3><p style="white-space:pre-line;line-height:1.9;font-size:13px;margin-bottom:14px">${esc(C.welcome.b)}</p><button id="wbtn" class="btn" style="width:100%">${esc(C.welcome.btn||'موافقم')}</button></div>`;
  wm.style.cssText='position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#000c';}}
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-b],[data-c],[data-t],[data-n],[data-go],[data-bk],[data-cat],#wbtn,.back');
 if(!t)return;
 if(t.dataset.b!==undefined)go(bi+(+t.dataset.b));
 if(t.dataset.c!==undefined)cc(ci+(+t.dataset.c));
 if(t.dataset.t!==undefined)tt(ti+(+t.dataset.t));
 if(t.dataset.n!==undefined){const n=+t.dataset.n;if(n===0)show('home');else if(n===1)show('lib');else if(n===2||n===3)show('istk');else if(n===4)show('prof');}
 if(t.dataset.go)show(t.dataset.go);
 if(t.dataset.bk!==undefined)show('book',+t.dataset.bk);
 if(t.dataset.cat!==undefined){lc=t.dataset.cat;show('lib');}
 if(t.id==='wbtn'){const mo=$('#mo');if(mo){mo.style.display='none';mo.innerHTML='';}sessionStorage.setItem('asrar_welcomed','1');}
 if(t.classList.contains('back'))show(t.dataset.go||'home');
});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='sq'){lq=e.target.value.trim();show('lib');}});
swipe($('#bn'),d=>go(bi+(d>0?-1:1)));
swipe($('#cv'),d=>cc(ci+(d>0?-1:1)));
setTimeout(function loop(){cc(ci+1);setTimeout(loop,(C.set.cards||6)*1000);},(C.set.cards||6)*1000);
render();setNav(0);
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
</script>
</body>
</html>
